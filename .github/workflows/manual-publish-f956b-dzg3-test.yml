name: Manual Publish F956B DZG3 Test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout F956B test app branch
        uses: actions/checkout@v4
        with:
          ref: agent/f956b-dzg3-test-apk
          fetch-depth: 0

      - name: Initialize build record
        run: |
          mkdir -p test-builds/f956b-dzg3
          printf 'manual_started\n' > test-builds/f956b-dzg3/STATUS
          : > test-builds/f956b-dzg3/build.log

      - name: Checkout exact payload source
        uses: actions/checkout@v4
        with:
          repository: 666sxrA/Root-My-Galaxy-Payloads
          ref: agent/f956b-dzg3-port
          path: payload-src

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Set up Android NDK r29
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact payload and repository-UI APK
        id: build
        continue-on-error: true
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          exec > >(tee -a test-builds/f956b-dzg3/build.log) 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo '=== build exact q6q payload ==='
          make -C payload-src TARGET=q6q-F956BXXS4DZG3 release || {
            echo payload_failed > test-builds/f956b-dzg3/STATUS
            exit 21
          }

          PAYLOAD="payload-src/build/q6q-F956BXXS4DZG3/cve-2026-43499-app.release.so"
          test -f "$PAYLOAD" || {
            echo payload_missing > test-builds/f956b-dzg3/STATUS
            exit 22
          }
          test "$(stat -c %s "$PAYLOAD")" -eq 104128 || {
            echo payload_size_failed > test-builds/f956b-dzg3/STATUS
            exit 23
          }
          sha256sum "$PAYLOAD" | tee test-builds/f956b-dzg3/payload.sha256
          cp "$PAYLOAD" test-builds/f956b-dzg3/cve-2026-43499-app.so

          mkdir -p app/src/main/assets/payloads/q6q-F956BXXS4DZG3
          cp "$PAYLOAD" app/src/main/assets/payloads/q6q-F956BXXS4DZG3/cve-2026-43499-app.so

          echo '=== patch repository UI test entry ==='
          python3 tools/patch_f956b_repo_ui.py || {
            echo ui_patch_failed > test-builds/f956b-dzg3/STATUS
            exit 30
          }

          echo '=== build Android test APK ==='
          ./gradlew assembleDebug --no-daemon || {
            echo apk_build_failed > test-builds/f956b-dzg3/STATUS
            exit 31
          }

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK" -a -f "$APK" || {
            echo apk_missing > test-builds/f956b-dzg3/STATUS
            exit 32
          }
          cp "$APK" test-builds/f956b-dzg3/F956B-DZG3-exploit-test.apk
          sha256sum test-builds/f956b-dzg3/F956B-DZG3-exploit-test.apk \
            | tee test-builds/f956b-dzg3/apk.sha256
          echo success > test-builds/f956b-dzg3/STATUS

      - name: Publish build record to test branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f test-builds/f956b-dzg3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: publish F956B DZG3 test APK [skip ci]'
          git push origin HEAD:agent/f956b-dzg3-test-apk

      - name: Upload APK artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f956b-dzg3-exploit-test-apk
          path: test-builds/f956b-dzg3/
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
